[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "napguard"
version = "0.1.0"
description = "Selective checkpoint protection and recovery for compatible Linux workloads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/napguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
# Stage 02 experiment package (ngexp) is importable by its unit tests.
pythonpath = ["experiments/stage02"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments/stage02"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
files = ["src", "tests", "experiments/stage02"]
mypy_path = "experiments/stage02"
python_version = "3.12"
# NapGuard is Linux-only: type-check against Linux stubs on every host.
platform = "linux"
strict = true

